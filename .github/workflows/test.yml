name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[all]"
          pip install ruff
          python -m compileall -q mail_digest
      - name: Lint (ruff: bug 类检查，抓未定义名/未用导入)
        run: ruff check . --select F --exclude data
      - name: Tests (含安全回归 + 真实 CLI 冒烟)
        run: |
          python tests/test_local.py
          python -m mail_digest.ads_cli run >/dev/null || true
          python -m mail_digest.grants_cli run >/dev/null || true
          python -m mail_digest.ads_cli push >/dev/null || true
          python -m mail_digest.grants_cli push >/dev/null || true
