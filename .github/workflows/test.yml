name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[all]"
          pip install ruff
          python -m compileall -q mail_digest
      - name: Lint (ruff: bug 类检查，抓未定义名/未用导入)
        run: ruff check . --select F --exclude data
      - name: Tests (含安全回归)
        run: python tests/test_local.py
      - name: CLI smoke (真实执行，无 || true)
        run: |
          export MAIL_DIGEST_DATA_DIR="$(mktemp -d)"
          python -m mail_digest.ads_cli run
          GRANT_ALLOWED_SENDERS='*@example.edu' python -m mail_digest.grants_cli run
          python -m mail_digest.ads_cli push
          python -m mail_digest.grants_cli push
