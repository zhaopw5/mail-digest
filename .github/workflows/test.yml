name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install -e ".[all]"
          pip install ruff
          python -m compileall -q mail_digest
      - name: Lint (ruff: bug 类检查，抓未定义名/未用导入)
        run: ruff check . --select F --exclude data
      - name: Tests (含安全回归)
        run: python tests/test_local.py
      - name: CLI smoke (有邮件内容的真实处理，无 || true)
        run: |
          export MAIL_DIGEST_DATA_DIR="$(mktemp -d)"
          mkdir -p "$MAIL_DIGEST_DATA_DIR/emails"
          # ADS 样例邮件（离线模式：无 token 只提取 bibcode，不联网）
          cp tests/sample_ads.eml "$MAIL_DIGEST_DATA_DIR/emails/20260901_000001.eml"
          # 基金样例邮件（白名单域 + 申报主题 + 附件）
          python - <<'PY'
          import base64
          from pathlib import Path
          from email.message import EmailMessage
          msg = EmailMessage()
          msg["From"] = "孙姗珍 <sshanzh@mail.sysu.edu.cn>"
          msg["To"] = "me@mail.sysu.edu.cn"
          msg["Subject"] = "关于组织申报2027年度XX专项项目的通知"
          msg["Date"] = "Wed, 03 Sep 2026 09:00:00 +0800"
          msg.set_content("请各单位于2026年10月5日前提交申报材料，单项资助不超过200万元。")
          p = Path(__import__("os").environ["MAIL_DIGEST_DATA_DIR"]) / "emails" / "20260903_000002.eml"
          p.write_bytes(msg.as_bytes())
          PY
          python -m mail_digest.ads_cli run
          GRANT_ALLOWED_SENDERS='*@mail.sysu.edu.cn' python -m mail_digest.grants_cli run
          python -m mail_digest.ads_cli push
          python -m mail_digest.grants_cli push
